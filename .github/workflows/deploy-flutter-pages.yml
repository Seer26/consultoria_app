name: Deploy Flutter Web to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS URL of the temporary demonstration API
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: >-
          flutter build web --release
          --base-href /consultoria_app/
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=SHOW_DEMO_CREDENTIALS=false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
