name: consultoria_app
description: "Plataforma de consultoria empresarial inteligente com IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.4.3+1
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Authentication & Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  jwt_decoder: ^2.0.1
  
  # Charts & Data Visualization
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^27.1.48
  
  # PDF & Excel Export
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.4
  
  # Forms & Validation
  intl: ^0.19.0  # Downgrade para compatibilidade com syncfusion_flutter_charts
  
  # Navigation
  go_router: ^14.2.0
  
  # File & Media
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Video Player (para treinamentos)
  video_player: ^2.9.1
  chewie: ^1.8.2
  
  # QR Code & Barcode
  qr_flutter: ^4.1.0
  
  # Date & Time
  table_calendar: ^3.1.2
  timeago: ^3.7.0
  
  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  logger: ^2.4.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation - versões compatíveis
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.2  # Versão mais antiga compatível
  freezed: ^2.4.7  # Versão mais antiga compatível
  hive_generator: ^2.0.0  # Versão mais antiga

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
