services:
  api:
    build:
      context: ../../saas
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: 3000
      DATABASE_PATH: /var/lib/consultoria/consultoria.sqlite
      SQLITE_BACKUP_DIR: /var/backups/consultoria
      SQLITE_BACKUP_RETENTION: "10"
      SQLITE_VOLUME_ACK: single-instance-persistent-volume
      API_REPLICA_COUNT: "1"
      JWT_SECRET: ${JWT_SECRET:?configure no secret manager}
      JWT_EXPIRES_IN: 7d
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?configure a URL HTTPS do Flutter}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?configure a URL HTTPS da API}
      CORS_ORIGINS: ${CORS_ORIGINS:?configure a origem HTTPS exata}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ENABLE_DEMO_SEED: "false"
      EMAIL_PROVIDER: http
      EMAIL_ALLOW_TEST_PROVIDER: "false"
      EMAIL_FROM: ${EMAIL_FROM:?configure o remetente validado}
      EMAIL_API_URL: ${EMAIL_API_URL:?configure a URL HTTPS do provider}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?configure no secret manager}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REQUIRE_AI_IN_READINESS: ${REQUIRE_AI_IN_READINESS:-false}
      ENABLE_INTERNAL_METRICS: "true"
      REQUIRE_LEGAL_ACCEPTANCE: "true"
      TERMS_VERSION: ${TERMS_VERSION:-beta-draft-v1}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-beta-draft-v1}
      ENABLE_EXTERNAL_ALERTS: ${ENABLE_EXTERNAL_ALERTS:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-3000}
      BACKUP_EXTERNAL_PROVIDER: ${BACKUP_EXTERNAL_PROVIDER:-none}
      BACKUP_EXTERNAL_DIRECTORY: ${BACKUP_EXTERNAL_DIRECTORY:-}
      LOG_FORMAT: json
    ports:
      - "3000:3000"
    volumes:
      - consultoria_staging_data:/var/lib/consultoria
      - consultoria_staging_backups:/var/backups/consultoria
    deploy:
      replicas: 1

volumes:
  consultoria_staging_data:
  consultoria_staging_backups:
