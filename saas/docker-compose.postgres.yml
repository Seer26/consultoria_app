services:
  postgres:
    image: postgres:16-alpine
    container_name: consultoria-postgres
    environment:
      POSTGRES_DB: consultoria
      POSTGRES_USER: consultoria
      POSTGRES_PASSWORD: consultoria_local_password
    ports:
      - "5432:5432"
    volumes:
      - consultoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultoria -d consultoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: consultoria-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://consultoria:consultoria_local_password@postgres:5432/consultoria
      JWT_SECRET: replace-with-a-strong-local-secret-for-docker
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://localhost:8080
      ENABLE_DEMO_SEED: "false"
      OPENAI_API_KEY: ""
    ports:
      - "3000:3000"

volumes:
  consultoria_postgres_data:
